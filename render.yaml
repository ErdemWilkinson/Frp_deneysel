services:
  - type: web
    name: acik-masa
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DM_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
